name: Refresh dashboard and deploy to Pages

on:
  # Every 30 minutes (UTC). 30 min cadence = ~48 runs/day, well under the 2000 free Action minutes/month.
  schedule:
    - cron: '*/30 * * * *'
  # Manual trigger from the Actions tab + the in-dashboard "Refresh Now" button (via workflow_dispatch API).
  workflow_dispatch: {}
  # Also re-run on direct edits to the dashboard, the refresh script, or this workflow.
  push:
    branches: [main]
    paths:
      - 'Task_Efficiency_Dashboard.html'
      - 'refresh_from_metabase.py'
      - '.github/workflows/scheduled-refresh.yml'

permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment can run at a time; don't cancel an in-progress refresh.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run refresh script
        env:
          METABASE_URL:       ${{ secrets.METABASE_URL }}
          METABASE_API_KEY:   ${{ secrets.METABASE_API_KEY }}
          METABASE_CARD_ID:   ${{ secrets.METABASE_CARD_ID }}
          DASHBOARD_HTML:     Task_Efficiency_Dashboard.html
          ZOHO_CLIENT_ID:     ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID:        ${{ secrets.ZOHO_ORG_ID }}
        run: python3 refresh_from_metabase.py

      - name: Commit refreshed HTML (audit trail)
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Task_Efficiency_Dashboard.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-refresh: Metabase data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Build _site folder
        run: |
          mkdir -p _site
          cp Task_Efficiency_Dashboard.html _site/index.html
          cp Task_Efficiency_Dashboard.html _site/Task_Efficiency_Dashboard.html
          # Copy image assets (logos, etc.) so they're served from Pages
          cp -v *.png *.jpg _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
